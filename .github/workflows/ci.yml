
name: CI - Django

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main

jobs:
  testes:
    name: Testes automatizados
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: papelaria_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d papelaria_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: "ci-only-secret-key-not-for-production"
      DB_NAME: papelaria_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install coverage==7.17.3

      - name: Verificar configuracao Django
        run: python manage.py check

      - name: Verificar migracoes
        run: python manage.py makemigrations --check --dry-run

      - name: Executar testes automatizados
        run: |
          python -m coverage run --source=estoque --omit="*/tests.py,*/migrations/*" manage.py test estoque

      - name: Gerar relatorio de cobertura
        run: python -m coverage report -m
